version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: url-shortener-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: urlshortener
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: migrator/Dockerfile
    environment:
      DATABASE_URL: postgres://appuser:apppassword@postgres:5432/urlshortener?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: url-shortener-api
    environment:
      DATABASE_URL: postgres://appuser:apppassword@postgres:5432/urlshortener?sslmode=disable
      JWT_SECRET: dev_secret_fixed_do_not_change_12345
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      SERVER_PORT: :8080
      FRONTEND_URL: http://localhost
      GEOIP_DB_PATH: /geoip/dbip-country-lite.mmdb
      TRUSTED_PROXY_HOST: frontend
    volumes:
      - ./geoip:/geoip
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 🔥 Передаём обе переменные в сборку
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_SHORT_LINK_DOMAIN: ${VITE_SHORT_LINK_DOMAIN:-http://localhost}
    environment:
      # 🔥 Дублируем для Vite (он читает env переменные при npm run build)
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
      - VITE_SHORT_LINK_DOMAIN=${VITE_SHORT_LINK_DOMAIN:-http://localhost}
    container_name: url-shortener-web
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
